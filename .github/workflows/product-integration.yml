name: Product integration

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: product-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adapters:
    name: Real Sisyphus and model-picker adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: adapter-suite
      - uses: actions/checkout@v6
        with:
          repository: byhow/sisyphus
          ref: f735977eb65b707a795df85e30444b9be0f723f2
          path: sisyphus
      - uses: actions/checkout@v6
        with:
          repository: byhow/model-picker
          ref: cf176b99c535bc79121f02c669e32ac49e87ff5e
          path: model-picker
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: adapter-suite/package-lock.json
      - run: npm ci
        working-directory: adapter-suite
      - run: bun install --frozen-lockfile
        working-directory: sisyphus
      - run: bun run build:binary
        working-directory: sisyphus
      - run: bun install --frozen-lockfile
        working-directory: model-picker
      - run: bun run --cwd apps/cli build:bin
        working-directory: model-picker
      - name: Exercise real product processes through adapters
        env:
          PI_PRODUCT_SISYPHUS_BIN: ${{ github.workspace }}/sisyphus/dist/sy
          PI_PRODUCT_MODEL_PICKER_BIN: ${{ github.workspace }}/model-picker/apps/cli/dist/model-picker
        run: npm run verify:product-integration
        working-directory: adapter-suite
