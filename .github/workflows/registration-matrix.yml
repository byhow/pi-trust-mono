name: Registration matrix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify manifest-driven extension registrations
        run: npm run verify:registration
