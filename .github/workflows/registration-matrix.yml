name: Registration matrix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.16.0 --ignore-scripts --registry=https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Verify manifest-driven extension registrations
        run: npm run verify:registration
