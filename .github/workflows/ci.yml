name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public lockfile
        run: npm run verify:lockfile

      - name: Verify package contracts
        run: npm run verify:contracts

      - name: Verify manifest registrations
        run: npm run verify:registration

      - name: Verify packed payloads
        run: npm run verify:pack

      - name: Lint (biome)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Test with coverage (vitest)
        run: npm run test:coverage
